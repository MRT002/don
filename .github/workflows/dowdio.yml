name: Download YouTube Audio → Google Drive

on:
  workflow_dispatch:     # اجرا دستی
    inputs:
      links_file:
        description: 'نام فایل لینک‌ها (پیش‌فرض: links.txt)'
        required: false
        default: 'links.txt'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      # ==================== دانلود صوت ====================
      - name: Download Audio (64kbps)
        run: |
          yt-dlp \
            -f "bestaudio/best" \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 64K \
            --output "%(title)s.%(ext)s" \
            --ignore-errors \
            --no-warnings \
            -a ${{ github.event.inputs.links_file || 'links.txt' }}
        continue-on-error: true

      # ==================== آپلود به Google Drive ====================
      - name: Upload to Google Drive
        uses: willo32/google-drive-upload-action@v1
        with:
          target: "*.mp3"                    # همه فایل‌های mp3
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          # اگر می‌خوای همه فایل‌ها رو داخل یک پوشه zip کنی:
          # zip_files: true
          # zip_name: youtube_audios.zip
