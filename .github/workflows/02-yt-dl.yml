name: 01- 🎵 YouTube Audio Downloader (Multi-URL)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video/page URLs (space-separated - max 70 links)'
        required: true
        type: string
      password:
        description: '🔒 Password for zip files (optional)'
        required: false
        default: ''
        type: string

jobs:
  download-youtube-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: Start WARP Container
        run: |
          echo "Starting Cloudflare WARP container..."
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15
          echo "Checking WARP status..."
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          pip3 install --upgrade yt-dlp

      - name: Download Audio Files (64kbps MP3 - Concurrent)
        run: |
          URL_INPUT="${{ github.event.inputs.youtube_url }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"
          
          # محدودیت ۷۰ لینک
          read -r -a URLS <<< "$URL_INPUT"
          TOTAL_URLS=${#URLS[@]}
          
          if [ $TOTAL_URLS -gt 70 ]; then
            echo "❌ Error: Maximum 70 URLs allowed. You provided $TOTAL_URLS URLs."
            exit 1
          fi
          
          echo "╔═══════════════════════════════════╗"
          echo "║  🎵 64kbps MP3 Audio Downloader  ║"
          echo "╚═══════════════════════════════════╝"
          echo ""
          echo "🔢 Received $TOTAL_URLS URL(s):"
          printf "  → %s\n" "${URLS[@]}"
          echo ""
          echo "🎵 Audio Quality: 64kbps MP3"
          echo "📥 Concurrent downloads: Up to 5 at a time"
          echo ""
          
          SPLIT_MB=45
          BACKUP_DIR="/tmp/audio_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          mkdir -p audios temp_downloads
          
          sanitize_name() {
            echo "$1" | sed 's/ /-/g' | sed 's/　/-/g' | tr -s '-' | sed 's/[^a-zA-Z0-9\u0600-\u06FF\uFB8A\u067E\u0686\u06AF\u200C\u064E\u064F\u0650\u0651\u0652._-]/-/g'
          }
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          # فرمت صوتی با کیفیت 64kbps MP3
          AUDIO_FORMAT="bestaudio[abr<=64]/bestaudio[bitrate<=64]/bestaudio"
          POST_ARGS="--postprocessor-args \"-acodec libmp3lame -ab 64k -ar 22050 -ac 2\""
          
          download_audio() {
            local URL="$1"
            local INDEX="$2"
            
            echo "🎵 [$INDEX/$TOTAL_URLS] Downloading: $URL"
            
            for METHOD in 1 2 3 4 5; do
              echo "  ⚡ Method $METHOD..."
              case $METHOD in
                1)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" \
                    --format "$AUDIO_FORMAT" \
                    --extract-audio \
                    --audio-format mp3 \
                    --audio-quality 2 \
                    --postprocessor-args "-acodec libmp3lame -ab 64k -ar 22050 -ac 2" \
                    --output "temp_downloads/%(title)s.%(ext)s" \
                    --retries 5 \
                    --fragment-retries 5 \
                    --no-check-certificates \
                    --concurrent-fragments 8 \
                    --extractor-args "youtube:player_client=web" \
                    --js-runtimes deno \
                    --no-playlist \
                    "$URL" && return 0
                    ;;
                2)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" \
                    --format "$AUDIO_FORMAT" \
                    --extract-audio \
                    --audio-format mp3 \
                    --audio-quality 2 \
                    --postprocessor-args "-acodec libmp3lame -ab 64k -ar 22050 -ac 2" \
                    --output "temp_downloads/%(title)s.%(ext)s" \
                    --retries 5 \
                    --extractor-args "youtube:player_client=android" \
                    --no-playlist \
                    "$URL" && return 0
                    ;;
                3)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" \
                    --format "$AUDIO_FORMAT" \
                    --extract-audio \
                    --audio-format mp3 \
                    --audio-quality 2 \
                    --postprocessor-args "-acodec libmp3lame -ab 64k -ar 22050 -ac 2" \
                    --output "temp_downloads/%(title)s.%(ext)s" \
                    --retries 5 \
                    --extractor-args "youtube:player_client=mweb" \
                    --no-playlist \
                    "$URL" && return 0
                    ;;
                4)
                  yt-dlp \
                    --format "$AUDIO_FORMAT" \
                    --extract-audio \
                    --audio-format mp3 \
                    --audio-quality 2 \
                    --postprocessor-args "-acodec libmp3lame -ab 64k -ar 22050 -ac 2" \
                    --output "temp_downloads/%(title)s.%(ext)s" \
                    --retries 5 \
                    --extractor-args "youtube:player_client=web" \
                    --js-runtimes deno \
                    --no-playlist \
                    "$URL" && return 0
                    ;;
                5)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" \
                    --format "$AUDIO_FORMAT" \
                    --extract-audio \
                    --audio-format mp3 \
                    --audio-quality 2 \
                    --postprocessor-args "-acodec libmp3lame -ab 64k -ar 22050 -ac 2" \
                    --output "temp_downloads/%(title)s.%(ext)s" \
                    --retries 5 \
                    --extractor-args "youtube:player_client=web,mweb,android" \
                    --js-runtimes deno \
                    --no-playlist \
                    "$URL" && return 0
                    ;;
              esac
              sleep 3
            done
            return 1
          }
          
          # دانلود همزمان با حداکثر ۵ تا در آن واحد
          export -f download_audio
          export TOTAL_URLS URLS AUDIO_FORMAT
          
          SUCCESS_COUNT=0
          FAILED_URLS=()
          
          # تابع برای دانلود موازی
          download_parallel() {
            local URL="$1"
            local INDEX="$2"
            if download_audio "$URL" "$INDEX"; then
              echo "✅ Success: $URL"
              return 0
            else
              echo "❌ Failed: $URL"
              return 1
            fi
          }
          export -f download_parallel
          
          # اجرای دانلود موازی با حداکثر ۵ تا همزمان
          printf "%s\n" "${URLS[@]}" | \
            xargs -P 5 -I {} bash -c 'download_parallel "$@"' _ {} \
            || true
          
          # بررسی فایل‌های دانلود شده
          find temp_downloads -name "*.part" -delete 2>/dev/null
          
          # شمارش فایل‌های MP3
          MP3_COUNT=$(find temp_downloads -name "*.mp3" 2>/dev/null | wc -l)
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Download Summary:"
          echo "   Total URLs: $TOTAL_URLS"
          echo "   Successfully downloaded: $MP3_COUNT MP3 files"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ $MP3_COUNT -eq 0 ]; then
            echo "❌ No audio files downloaded successfully."
            exit 1
          fi
          
          # بررسی کیفیت فایل‌های MP3 دانلود شده
          echo ""
          echo "🎵 Checking audio quality..."
          for MP3 in temp_downloads/*.mp3; do
            if [ -f "$MP3" ]; then
              BITRATE=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$MP3" 2>/dev/null || echo "0")
              if [ -n "$BITRATE" ] && [ "$BITRATE" -gt 0 ]; then
                BITRATE_KBPS=$((BITRATE / 1000))
                echo "  📁 $(basename "$MP3"): ${BITRATE_KBPS}kbps"
              fi
            fi
          done
          
          # ادامه فرآیند آرشیو و آپلود...
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          get_random_word() {
            local WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river")
            echo "${WORDS[$RANDOM % ${#WORDS[@]}]}_$RANDOM"
          }
          
          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ] || [ -d "$BACKUP_DIR/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }
          
          > /tmp/audio_info.txt
          FILE_INDEX=0
          
          for FILE in temp_downloads/*.mp3; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE" .mp3)
            FILENAME_NO_EXT=$(sanitize_name "$BASENAME")
            FILE_INDEX=$((FILE_INDEX + 1))
            
            echo "Processing: $(basename "$FILE") ($(( SIZE / 1024 / 1024 ))MB)"
            
            FINAL_FOLDER_NAME=$(get_unique_folder "audios" "$FILENAME_NO_EXT")
            mkdir -p "$BACKUP_DIR/${FINAL_FOLDER_NAME}"
            
            echo "${FILENAME_NO_EXT}|${FINAL_FOLDER_NAME}" >> /tmp/audio_info.txt
            FOLDER_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}")
            
            if [ "$SIZE" -gt $((45 * 1024 * 1024)) ]; then
              echo "  Splitting into ${SPLIT_MB}MB parts..."
              ARCHIVE_BASE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}"
              if [ -n "$ZIP_PASSWORD" ]; then
                7z a -tzip -v${SPLIT_MB}m -p"${ZIP_PASSWORD}" -mx=0 "${ARCHIVE_BASE}.zip" "$FILE"
              else
                zip -0 -s ${SPLIT_MB}m "${ARCHIVE_BASE}.zip" "$FILE"
              fi
              
              DOWNLOAD_LINKS_MD=""
              LINK_NUM=0
              TOTAL_SIZE=0
              for part_file in $(ls "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.zip "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.z[0-9]* 2>/dev/null | sort -V); do
                PART_BASENAME=$(basename "$part_file")
                PART_ENCODED=$(urlencode "${PART_BASENAME}")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/audios/${FOLDER_ENCODED}/${PART_ENCODED}"
                LINK_NUM=$((LINK_NUM + 1))
                DL_SIZE=$(stat -c%s "$part_file")
                TOTAL_SIZE=$((TOTAL_SIZE + DL_SIZE))
                DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | $((DL_SIZE/1024/1024)) MB | [Download](${RAW_LINK}) |"$'\n'
              done
              TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
              
              README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
              {
                printf '# 🎵 %s\n\n' "$FILENAME_NO_EXT"
                printf '## Audio Information\n\n'
                printf '| Property | Value |\n'
                printf '|----------|-------|\n'
                printf '| **Track Name** | `%s` |\n' "$FILENAME_NO_EXT"
                printf '| **Format** | MP3 |\n'
                printf '| **Quality** | **64kbps** |\n'
                printf '| **Sample Rate** | 22.05 kHz |\n'
                printf '| **Channels** | Stereo |\n'
                printf '| **Total Size** | %s MB (%s parts) |\n' "$TOTAL_SIZE_MB" "$LINK_NUM"
                if [ -n "$ZIP_PASSWORD" ]; then
                  printf '| **Password Protected** | ✅ YES |\n'
                else
                  printf '| **Password Protected** | ❌ NO |\n'
                fi
                printf '\n## Download Links\n\n'
                printf '> ⬇️ Download **all parts**, then open `%s.zip`\n\n' "$FILENAME_NO_EXT"
                printf '| # | File | Size | Link |\n'
                printf '|---|------|------|------|\n'
                printf '%s' "$DOWNLOAD_LINKS_MD"
                printf '\n## How to Extract\n\n'
                printf 'Download all parts into the **same folder**, then:\n\n'
                if [ -n "$ZIP_PASSWORD" ]; then
                  printf '- **Windows**: Use 7-Zip → Extract Here → enter password\n'
                  printf '- **Mac/Linux**: `unzip %s.zip` → enter password\n' "$FILENAME_NO_EXT"
                else
                  printf '- **Windows/Mac/Linux**: Double-click `%s.zip`\n' "$FILENAME_NO_EXT"
                fi
                printf '\n---\n*🎵 Downloaded at 64kbps MP3 quality*\n'
              } > "$README_FILE"
            else
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -P "${ZIP_PASSWORD}" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip" "$FILE"
                SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
                FILE_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}.zip")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/audios/${FOLDER_ENCODED}/${FILE_ENCODED}"
                README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
                {
                  printf '# 🎵 %s\n\n' "$FILENAME_NO_EXT"
                  printf '## Audio Information\n\n'
                  printf '| Property | Value |\n'
                  printf '|----------|-------|\n'
                  printf '| **Track Name** | `%s` |\n' "$FILENAME_NO_EXT"
                  printf '| **Format** | MP3 |\n'
                  printf '| **Quality** | **64kbps** |\n'
                  printf '| **Sample Rate** | 22.05 kHz |\n'
                  printf '| **File Size** | %s MB |\n' "$SIZE_MB"
                  printf '| **Password Protected** | ✅ YES |\n\n'
                  printf '## Download Link\n\n'
                  printf '[Download MP3](%s)\n\n' "$RAW_LINK"
                } > "$README_FILE"
              else
                cp "$FILE" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.mp3"
                SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
                FILE_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}.mp3")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/audios/${FOLDER_ENCODED}/${FILE_ENCODED}"
                README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
                {
                  printf '# 🎵 %s\n\n' "$FILENAME_NO_EXT"
                  printf '## Audio Information\n\n'
                  printf '| Property | Value |\n'
                  printf '|----------|-------|\n'
                  printf '| **Track Name** | `%s` |\n' "$FILENAME_NO_EXT"
                  printf '| **Format** | MP3 |\n'
                  printf '| **Quality** | **64kbps** |\n'
                  printf '| **Sample Rate** | 22.05 kHz |\n'
                  printf '| **File Size** | %s MB |\n\n' "$SIZE_MB"
                  printf '## Download Link\n\n'
                  printf '[Download MP3](%s)\n\n' "$RAW_LINK"
                } > "$README_FILE"
              fi
            fi
          done
          
          rm -rf temp_downloads

      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Commit & Push to Repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          echo "Backup directory: $BACKUP_DIR"
          
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH" 2>/dev/null || true
          mkdir -p audios
          cp -r "$BACKUP_DIR"/* audios/ 2>/dev/null || true
          
          # ساخت README اصلی
          MASTER_README="audios/README.md"
          {
            echo "# 🎵 Downloaded Audio Files (64kbps MP3)"
            echo ""
            echo "| # | Track Name | Format | Quality |"
            echo "|---|------------|--------|---------|"
          } > "$MASTER_README"
          
          NUM=0
          for folder in audios/*/; do
            [ -d "$folder" ] || continue
            FOLDER_NAME=$(basename "$folder")
            [ -f "$folder/README.md" ] || continue
            NUM=$((NUM+1))
            FOLDER_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FOLDER_NAME'))")
            FOLDER_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/${BRANCH}/audios/${FOLDER_ENCODED}"
            printf "| %s | [%s](%s) | MP3 | 64kbps |\n" "$NUM" "$FOLDER_NAME" "$FOLDER_LINK" >> "$MASTER_README"
          done
          
          git add audios/
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          if ! git diff --cached --quiet; then
            git commit -m "🎵 Add 64kbps MP3 audio files [skip ci]"
            git push origin HEAD:"$BRANCH"
            echo "✅ Push successful!"
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 All audio files uploaded successfully!"
          echo "📁 Folder: audios/"
          echo "🎵 Quality: 64kbps MP3"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
