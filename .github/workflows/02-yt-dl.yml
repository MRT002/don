name: 01- 💾 YouTube Downloader (Multi-URL)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video/page URLs (space-separated)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: '🔒 Password for zip files (optional)'
        required: false
        default: ''
        type: string

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: Start WARP Container
        run: |
          echo "Starting Cloudflare WARP container..."

          docker network create warp-net || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15

          echo "Checking WARP status..."
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              echo "$RESULT"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done

          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "WARP proxy is ready!"
          else
            echo "WARP might not be fully active, but continuing anyway..."
            echo "Response: $FINAL"
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc unzip

          # Install Deno (JS runtime required by yt-dlp for YouTube n-challenge solving)
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

          pip3 install --upgrade yt-dlp

      - name: Download YouTube Videos (Multiple URLs)
        run: |
          URL_INPUT="${{ github.event.inputs.youtube_url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"

          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))

          BACKUP_DIR="/tmp/video_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt

          mkdir -p videos tmp_downloads

          echo "╔═══════════════════════════════════╗"
          echo "║  AVASAM Multi-URL Downloader    ║"
          echo "╚═══════════════════════════════════╝"
          echo ""

          # تبدیل رشته‌ی ورودی به آرایه
          read -r -a URLS <<< "$URL_INPUT"
          TOTAL_URLS=${#URLS[@]}
          echo "🔢 Received $TOTAL_URLS URL(s):"
          printf "  → %s\n" "${URLS[@]}"
          echo ""
          echo "🎬 Quality: $QUALITY"
          echo ""

          sanitize_name() {
            echo "$1" | sed 's/ /-/g' | sed 's/　/-/g' | tr -s '-'
          }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # فرمت نهایی (وابسته به کیفیت)
          case "$QUALITY" in
            "audio") FORMAT="bestaudio/bestaudio*" ;;
            "best")  FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best" ;;
            "2160"|"4k") FORMAT="bestvideo[height=2160]+bestaudio/bestvideo[height<=2160]+bestaudio/bestvideo[height=2160]*+bestaudio*/bestvideo[height<=2160]*+bestaudio*" ;;
            "1440"|"2k") FORMAT="bestvideo[height=1440]+bestaudio/bestvideo[height<=1440]+bestaudio/bestvideo[height=1440]*+bestaudio*/bestvideo[height<=1440]*+bestaudio*" ;;
            "1080") FORMAT="bestvideo[height=1080]+bestaudio/bestvideo[height<=1080]+bestaudio/bestvideo[height=1080]*+bestaudio*/bestvideo[height<=1080]*+bestaudio*" ;;
            "720")  FORMAT="bestvideo[height=720]+bestaudio/bestvideo[height<=720]+bestaudio/bestvideo[height=720]*+bestaudio*/bestvideo[height<=720]*+bestaudio*" ;;
            "480")  FORMAT="bestvideo[height=480]+bestaudio/bestvideo[height<=480]+bestaudio/bestvideo[height=480]*+bestaudio*/bestvideo[height<=480]*+bestaudio*" ;;
            *)      FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best" ;;
          esac

          # ───────────────── تابع دانلود یک URL خاص ─────────────────
          download_single_url() {
            local URL="$1"
            local IS_PLAYLIST=false

            # اگر آدرس شامل پارامتر list= باشد، پلی‌لیست است
            if [[ "$URL" == *"list="* ]]; then
              IS_PLAYLIST=true
            fi

            # تنظیم پرچم‌های مشترک
            if [ "$QUALITY" = "audio" ]; then
              COMMON_FLAGS="--output tmp_downloads/%(title)s.%(ext)s --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            else
              COMMON_FLAGS="--merge-output-format mp4 --format-sort res,+codec:vp9.1,+size --output tmp_downloads/%(title)s.%(ext)s --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            fi

            # فقط برای ویدیوهای تکی --no-playlist اضافه شود
            if [ "$IS_PLAYLIST" = false ]; then
              COMMON_FLAGS="$COMMON_FLAGS --no-playlist"
              echo "  🔹 Single video mode (--no-playlist)"
            else
              echo "  📃 Playlist detected (all videos will be downloaded)"
            fi

            echo "  🔗 Processing: $URL"
            echo ""

            # ۸ روش مختلف برای دانلود (ترتیب قبلی)
            for METHOD in 1 2 3 4 5 6 7 8; do
              echo "  ⚡ Trying method $METHOD..."
              case $METHOD in
                1)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS \
                    --extractor-args "youtube:player_client=web" --js-runtimes deno \
                    --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                    --add-header "Accept-Language:en-US,en;q=0.9" "$URL" && return 0
                  ;;
                2)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS \
                    --extractor-args "youtube:player_client=tv_embedded" "$URL" && return 0
                  ;;
                3)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS \
                    --extractor-args "youtube:player_client=android_vr" "$URL" && return 0
                  ;;
                4)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS \
                    --extractor-args "youtube:player_client=mweb" "$URL" && return 0
                  ;;
                5)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS \
                    --extractor-args "youtube:player_client=android" \
                    --user-agent "Mozilla/5.0 (Linux; Android 12; SM-S906N Build/QP1A.190711.020) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36" "$URL" && return 0
                  ;;
                6)
                  yt-dlp --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno "$URL" && return 0
                  ;;
                7)
                  yt-dlp --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=mweb" "$URL" && return 0
                  ;;
                8)
                  yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS \
                    --extractor-args "youtube:player_client=web,mweb,android_vr" --js-runtimes deno "$URL" && return 0
                  ;;
              esac
              sleep 3
            done

            echo "  ❌ All 8 methods failed for: $URL"
            return 1
          }

          # ───────────────── حلقه روی همه URL ها ─────────────────
          SUCCESS_COUNT=0
          for ((i=0; i<TOTAL_URLS; i++)); do
            CURRENT_URL="${URLS[$i]}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📥 Downloading ($((i+1))/$TOTAL_URLS): $CURRENT_URL"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if download_single_url "$CURRENT_URL"; then
              echo "✅ Success: $CURRENT_URL"
              SUCCESS_COUNT=$((SUCCESS_COUNT+1))
            else
              echo "⚠️  Failed: $CURRENT_URL (skipping to next URL)"
            fi
            echo ""
          done

          if [ $SUCCESS_COUNT -eq 0 ]; then
            echo "❌ No videos were downloaded successfully."
            exit 1
          fi

          echo "🎉 $SUCCESS_COUNT out of $TOTAL_URLS URLs downloaded successfully."

          # ───────────────── ادامه‌ی مراحل (آرشیو، README، push) ─────────────────
          # (دقیقاً همان کد قبلی، بدون نیاز به تغییر)
          find tmp_downloads -name "*.part" -delete

          echo "Download complete!"
          echo "Files in tmp_downloads:"
          ls -la tmp_downloads/

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")

          get_random_word() {
            echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"
          }

          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"

            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ] || [ -d "$BACKUP_DIR/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }

          > /tmp/video_info.txt

          FILE_INDEX=0
          for FILE in tmp_downloads/*; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            FILENAME_NO_EXT="${BASENAME%.*}"
            EXT="${BASENAME##*.}"
            FILE_INDEX=$((FILE_INDEX + 1))

            FILENAME_NO_EXT=$(sanitize_name "$FILENAME_NO_EXT")

            echo "Processing: $BASENAME ($(( SIZE / 1024 / 1024 ))MB)"
            echo "Sanitized name: $FILENAME_NO_EXT"

            FINAL_FOLDER_NAME=$(get_unique_folder "videos" "$FILENAME_NO_EXT")

            mkdir -p "$BACKUP_DIR/${FINAL_FOLDER_NAME}"
            echo "Created backup folder: $BACKUP_DIR/${FINAL_FOLDER_NAME}"

            # ذخیره‌ی لینک اصلی برای README (از اولین URL یا ترکیبی – ما URL مرتبط با این فایل را نمی‌دانیم،
            # پس آدرس عمومی می‌گذاریم. اما می‌توانید در صورت نیاز تغییر دهید)
            README_URL="$URL_INPUT"

            echo "${FILENAME_NO_EXT}|${FINAL_FOLDER_NAME}" >> /tmp/video_info.txt

            TEMP_NAME="video_${FILE_INDEX}"
            FOLDER_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}")

            if [ "$SIZE" -gt "$SPLIT_BYTES" ]; then
              echo "Splitting $BASENAME into ${SPLIT_MB}MB parts..."

              ARCHIVE_BASE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}"

              if [ -n "$ZIP_PASSWORD" ]; then
                7z a -tzip -v${SPLIT_MB}m -p"${ZIP_PASSWORD}" -mx=0 "${ARCHIVE_BASE}.zip" "$FILE"
              else
                zip -0 -s ${SPLIT_MB}m "${ARCHIVE_BASE}.zip" "$FILE"
              fi

              PART_COUNT=$(ls "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.zip "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.z[0-9]* 2>/dev/null | wc -l)
              echo "Created $PART_COUNT parts"

              TOTAL_SIZE=0
              for part_file in "$BACKUP_DIR/${FINAL_FOLDER_NAME}"/*; do
                [ -f "$part_file" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$part_file")))
              done
              TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)

              DOWNLOAD_LINKS_MD=""
              LINK_NUM=0
              for part_file in $(ls "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.zip "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.z[0-9]* 2>/dev/null | sort -V); do
                PART_BASENAME=$(basename "$part_file")
                PART_ENCODED=$(urlencode "${PART_BASENAME}")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/videos/${FOLDER_ENCODED}/${PART_ENCODED}"
                LINK_NUM=$((LINK_NUM + 1))
                DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
              done

              MAIN_ZIP="${FINAL_FOLDER_NAME}.zip"
              README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
              {
                printf '%s\n' "# ${FILENAME_NO_EXT}"
                printf '%s\n' ""
                printf '%s\n' "---"
                printf '%s\n' "## Video Information"
                printf '%s\n' ""
                printf '%s\n' "| Property | Value |"
                printf '%s\n' "|----------|-------|"
                printf '%s\n' "| **Video Name** | \`${FILENAME_NO_EXT}\` |"
                printf '%s\n' "| **Download Source** | $README_URL |"
                printf '%s\n' "| **Total Size** | **${PART_COUNT} parts** - **${TOTAL_SIZE_MB} MB** |"
                printf '%s\n' "| **Quality** | **${QUALITY}** |"
                printf '%s\n' "| **Status** | **Complete (100%)** |"
                if [ -n "$ZIP_PASSWORD" ]; then
                  printf '%s\n' "| **Password Protected** | **YES** |"
                else
                  printf '%s\n' "| **Password Protected** | **NO** |"
                fi
                printf '%s\n' ""
                printf '%s\n' "## Download Links"
                printf '%s\n' ""
                printf '%s\n' "> ⬇️ Download **all parts**, then open \`${MAIN_ZIP}\`"
                printf '%s\n' "| # | File | Link |"
                printf '%s\n' "|---|------|------|"
                printf '%s' "${DOWNLOAD_LINKS_MD}"
                printf '%s\n' ""
                printf '%s\n' "## How to Extract"
                printf '%s\n' "Download all parts into the **same folder**, then:"
                if [ -n "$ZIP_PASSWORD" ]; then
                  printf '%s\n' "| OS | Steps |"
                  printf '%s\n' "|----|-------|"
                  printf '%s\n' "| **Windows** | Right-click \`${MAIN_ZIP}\` → Extract Here (needs 7-Zip/WinRAR) → enter password |"
                  printf '%s\n' "| **Mac** | Open with Keka → enter password |"
                  printf '%s\n' "| **Linux** | \`unzip ${MAIN_ZIP}\` → enter password |"
                  printf '%s\n' "| **Android** | Use ZArchiver → tap \`${MAIN_ZIP}\` → enter password |"
                else
                  printf '%s\n' "| OS | Steps |"
                  printf '%s\n' "|----|-------|"
                  printf '%s\n' "| **Windows** | Double-click \`${MAIN_ZIP}\` — opens automatically |"
                  printf '%s\n' "| **Mac** | Double-click — extracts with Archive Utility |"
                  printf '%s\n' "| **Linux** | \`unzip ${MAIN_ZIP}\` or right-click → Extract Here |"
                  printf '%s\n' "| **Android** | Tap \`${MAIN_ZIP}\` in your file manager |"
                fi
                printf '%s\n' ""
                printf '%s\n' "*This tool created by [avasam.ir](https://avasam.ir)*"
              } > "$README_FILE"
            else
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -P "${ZIP_PASSWORD}" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip" "$FILE"
                SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
                FILE_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}.zip")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/videos/${FOLDER_ENCODED}/${FILE_ENCODED}"
                README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
                {
                  printf '%s\n' "# ${FILENAME_NO_EXT}"
                  printf '%s\n' ""
                  printf '%s\n' "## Video Information"
                  printf '%s\n' "| Property | Value |"
                  printf '%s\n' "|----------|-------|"
                  printf '%s\n' "| **Video Name** | \`${FILENAME_NO_EXT}\` |"
                  printf '%s\n' "| **Download Source** | $README_URL |"
                  printf '%s\n' "| **Total Size** | **1 archive** - **${SIZE_MB} MB** |"
                  printf '%s\n' "| **Quality** | **${QUALITY}** |"
                  printf '%s\n' "| **Status** | **Complete (100%)** |"
                  printf '%s\n' "| **Password Protected** | **YES** |"
                  printf '%s\n' "## Download Link"
                  printf '%s\n' "| # | File | Link |"
                  printf '%s\n' "|---|------|------|"
                  printf '%s\n' "| 1 | \`${FINAL_FOLDER_NAME}.zip\` | [Download](${RAW_LINK}) |"
                } > "$README_FILE"
              else
                cp "$FILE" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.${EXT}"
                SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
                FILE_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}.${EXT}")
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/videos/${FOLDER_ENCODED}/${FILE_ENCODED}"
                README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
                {
                  printf '%s\n' "# ${FILENAME_NO_EXT}"
                  printf '%s\n' "## Video Information"
                  printf '%s\n' "| Property | Value |"
                  printf '%s\n' "|----------|-------|"
                  printf '%s\n' "| **Video Name** | \`${FILENAME_NO_EXT}\` |"
                  printf '%s\n' "| **Download Source** | $README_URL |"
                  printf '%s\n' "| **Total Size** | **1 file** - **${SIZE_MB} MB** |"
                  printf '%s\n' "| **Quality** | **${QUALITY}** |"
                  printf '%s\n' "| **Status** | **Complete (100%)** |"
                  printf '%s\n' "| **Password Protected** | **NO** |"
                  printf '%s\n' "## Download Link"
                  printf '%s\n' "| 1 | \`${FINAL_FOLDER_NAME}.${EXT}\` | [Download](${RAW_LINK}) |"
                } > "$README_FILE"
              fi
            fi
          done

          rm -rf tmp_downloads

      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Incremental Commit & Push
        run: |
          # (دقیقاً همان کد push قبلی – بدون تغییر)
          BRANCH="${GITHUB_REF_NAME}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "AVASAM (https://avasam.ir) - Incremental Push Mode"
          echo ""

          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          echo "Backup directory: $BACKUP_DIR"

          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)
          echo "Total files to push: $BACKUP_FILE_COUNT"

          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No files in backup directory!"
            exit 1
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          regenerate_master_readme() {
            MASTER_README="videos/README.md"
            echo "Regenerating master README..."
            {
              echo "# DOWNLOADED VIDEOS LIST :"
              echo ""
              echo "----"
              echo ""
            } > "$MASTER_README"

            NUM=0
            for folder in videos/*/; do
              [ -d "$folder" ] || continue
              FOLDER_NAME=$(basename "$folder")
              [ -f "$folder/README.md" ] || continue
              NUM=$((NUM+1))
              FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
              FOLDER_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/${BRANCH}/videos/${FOLDER_ENCODED}"
              printf -- "- %s. [%s](%s)\n" "$NUM" "$FOLDER_NAME" "$FOLDER_LINK" >> "$MASTER_README"
            done
            echo "Master README done ($NUM videos)"
          }

          push_single_file() {
            local FILE_PATH="$1"
            local MAX_RETRIES=5
            local RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              RETRY=$((RETRY+1))
              git fetch origin "$BRANCH" --quiet 2>/dev/null || true
              LOCAL_HEAD=$(git rev-parse HEAD 2>/dev/null || echo "none")
              REMOTE_HEAD=$(git rev-parse origin/"$BRANCH" 2>/dev/null || echo "none")
              if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ] && [ "$REMOTE_HEAD" != "none" ]; then
                echo "    Syncing with remote..."
                git reset --hard origin/"$BRANCH" 2>/dev/null || true
                mkdir -p videos
                cp -r "$BACKUP_DIR"/* videos/ 2>/dev/null || true
              fi
              git add "$FILE_PATH" 2>/dev/null || true
              if git diff --cached --quiet 2>/dev/null; then
                echo "    File already exists or no changes"
                return 0
              fi
              FILENAME=$(basename "$FILE_PATH")
              git commit -m "[AVASAM] Add: $FILENAME [skip ci]" --quiet 2>/dev/null || true
              echo "    Push attempt $RETRY/$MAX_RETRIES..."
              if timeout 120 git push origin HEAD:"$BRANCH" 2>&1; then
                echo "    SUCCESS!"
                return 0
              else
                echo "    Push failed, retrying..."
                sleep $((2+RANDOM%5))
              fi
            done
            echo "    WARNING: Failed to push $FILE_PATH"
            return 1
          }

          push_batch() {
            local BATCH_SIZE=5
            local FILES=("$@")
            local BATCH_COUNT=0
            local BATCH_FILES=()
            local TOTAL_PUSHED=0
            local TOTAL_FILES=${#FILES[@]}

            for FILE in "${FILES[@]}"; do
              BATCH_FILES+=("$FILE")
              BATCH_COUNT=$((BATCH_COUNT+1))
              if [ $BATCH_COUNT -ge $BATCH_SIZE ]; then
                TOTAL_PUSHED=$((TOTAL_PUSHED+BATCH_COUNT))
                echo ">>> Pushing batch ($TOTAL_PUSHED/$TOTAL_FILES)..."
                git fetch origin "$BRANCH" --quiet 2>/dev/null || true
                git reset --hard origin/"$BRANCH" 2>/dev/null || true
                mkdir -p videos
                cp -r "$BACKUP_DIR"/* videos/ 2>/dev/null || true
                for BF in "${BATCH_FILES[@]}"; do
                  git add "$BF" 2>/dev/null || true
                done
                if ! git diff --cached --quiet 2>/dev/null; then
                  git commit -m "[AVASAM] Add batch of $BATCH_COUNT files [skip ci]" --quiet 2>/dev/null || true
                  local PUSH_RETRY=0
                  local PUSH_SUCCESS=false
                  while [ $PUSH_RETRY -lt 5 ]; do
                    PUSH_RETRY=$((PUSH_RETRY+1))
                    if timeout 180 git push origin HEAD:"$BRANCH" 2>&1; then
                      PUSH_SUCCESS=true
                      echo "    Batch pushed successfully!"
                      break
                    else
                      echo "    Batch push failed, attempt $PUSH_RETRY/5..."
                      git fetch origin "$BRANCH" --quiet 2>/dev/null || true
                      git reset --hard origin/"$BRANCH" 2>/dev/null || true
                      mkdir -p videos
                      cp -r "$BACKUP_DIR"/* videos/ 2>/dev/null || true
                      for BF in "${BATCH_FILES[@]}"; do
                        git add "$BF" 2>/dev/null || true
                      done
                      if ! git diff --cached --quiet 2>/dev/null; then
                        git commit -m "[AVASAM] Add batch of $BATCH_COUNT files [skip ci]" --quiet 2>/dev/null || true
                      fi
                      sleep $((3+RANDOM%7))
                    fi
                  done
                  if [ "$PUSH_SUCCESS" = false ]; then
                    echo "WARNING: Batch push failed, trying files individually..."
                    for BF in "${BATCH_FILES[@]}"; do
                      push_single_file "$BF"
                    done
                  fi
                fi
                BATCH_FILES=()
                BATCH_COUNT=0
                sleep 2
              fi
            done

            if [ ${#BATCH_FILES[@]} -gt 0 ]; then
              TOTAL_PUSHED=$((TOTAL_PUSHED+${#BATCH_FILES[@]}))
              echo ">>> Pushing final batch ($TOTAL_PUSHED/$TOTAL_FILES)..."
              git fetch origin "$BRANCH" --quiet 2>/dev/null || true
              git reset --hard origin/"$BRANCH" 2>/dev/null || true
              mkdir -p videos
              cp -r "$BACKUP_DIR"/* videos/ 2>/dev/null || true
              for BF in "${BATCH_FILES[@]}"; do
                git add "$BF" 2>/dev/null || true
              done
              if ! git diff --cached --quiet 2>/dev/null; then
                git commit -m "[AVASAM] Add final batch [skip ci]" --quiet 2>/dev/null || true
                local PUSH_RETRY=0
                while [ $PUSH_RETRY -lt 5 ]; do
                  PUSH_RETRY=$((PUSH_RETRY+1))
                  if timeout 180 git push origin HEAD:"$BRANCH" 2>&1; then
                    echo "    Final batch pushed successfully!"
                    break
                  else
                    echo "    Push failed, attempt $PUSH_RETRY/5..."
                    sleep $((3+RANDOM%7))
                    git fetch origin "$BRANCH" --quiet 2>/dev/null || true
                    git reset --hard origin/"$BRANCH" 2>/dev/null || true
                    mkdir -p videos
                    cp -r "$BACKUP_DIR"/* videos/ 2>/dev/null || true
                    for BF in "${BATCH_FILES[@]}"; do
                      git add "$BF" 2>/dev/null || true
                    done
                    if ! git diff --cached --quiet 2>/dev/null; then
                      git commit -m "[AVASAM] Add final batch [skip ci]" --quiet 2>/dev/null || true
                    fi
                  fi
                done
              fi
            fi
          }

          echo "Syncing with remote repository..."
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"
          mkdir -p videos
          cp -r "$BACKUP_DIR"/* videos/

          ALL_FILES=()
          while IFS= read -r -d '' FILE; do
            ALL_FILES+=("$FILE")
          done < <(find videos -name "README.md" -print0 2>/dev/null)

          while IFS= read -r -d '' FILE; do
            ALL_FILES+=("$FILE")
          done < <(find videos -type f \( -name "*.zip" -o -name "*.z[0-9]*" -o -name "*.mp4" -o -name "*.mp3" -o -name "*.m4a" \) -print0 2>/dev/null | sort -z)

          TOTAL_FILES=${#ALL_FILES[@]}
          if [ $TOTAL_FILES -eq 0 ]; then
            echo "No files to push!"
            exit 0
          fi

          TOTAL_SIZE=0
          for F in "${ALL_FILES[@]}"; do
            [ -f "$F" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$F")))
          done
          TOTAL_SIZE_MB=$((TOTAL_SIZE/1024/1024))
          echo "Total size: ${TOTAL_SIZE_MB}MB"

          if [ $TOTAL_SIZE_MB -lt 100 ]; then
            echo "Small upload - pushing all at once..."
            git add -A videos/
            regenerate_master_readme
            git add videos/README.md
            if ! git diff --cached --quiet; then
              git commit -m "[AVASAM] Multi-URL download [skip ci]"
              PUSH_RETRY=0
              while [ $PUSH_RETRY -lt 10 ]; do
                PUSH_RETRY=$((PUSH_RETRY+1))
                if timeout 300 git push origin HEAD:"$BRANCH"; then
                  echo "Push successful!"
                  break
                else
                  echo "Push failed, retry $PUSH_RETRY/10..."
                  sleep $((3+RANDOM%7))
                  git fetch origin "$BRANCH"
                  git reset --hard origin/"$BRANCH"
                  mkdir -p videos
                  cp -r "$BACKUP_DIR"/* videos/
                  git add -A videos/
                  regenerate_master_readme
                  git add videos/README.md
                  if ! git diff --cached --quiet; then
                    git commit -m "[AVASAM] Multi-URL download [skip ci]"
                  fi
                fi
              done
            fi
          else
            echo "Large upload - using incremental batch push..."
            push_batch "${ALL_FILES[@]}"
            echo "Pushing master README..."
            git fetch origin "$BRANCH" --quiet 2>/dev/null || true
            git reset --hard origin/"$BRANCH" 2>/dev/null || true
            mkdir -p videos
            cp -r "$BACKUP_DIR"/* videos/ 2>/dev/null || true
            regenerate_master_readme
            git add videos/README.md
            if ! git diff --cached --quiet 2>/dev/null; then
              git commit -m "[AVASAM] Update video list [skip ci]" --quiet 2>/dev/null || true
              PUSH_RETRY=0
              while [ $PUSH_RETRY -lt 5 ]; do
                PUSH_RETRY=$((PUSH_RETRY+1))
                if timeout 60 git push origin HEAD:"$BRANCH" 2>&1; then
                  echo "Master README pushed!"
                  break
                else
                  echo "README push failed, retry $PUSH_RETRY/5..."
                  sleep 3
                fi
              done
            fi
          fi

          echo ""
          echo "✅ All files pushed successfully!"
          echo "AVASAM (https://avasam.ir)"
